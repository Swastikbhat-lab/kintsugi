name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install engine
        run: npm install
      - name: Install fixture toolchain
        run: cd fixture && npm install
      - name: Install Python toolchain (for the Python loop test)
        run: pip install pytest ruff
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: End-to-end fixture run
        run: |
          set -e
          OUT=$(npm run demo:ci 2>&1) || true
          echo "$OUT"
          echo "$OUT" | grep -q "5 committed" || { echo "expected 5 committed fixes"; exit 1; }
          echo "$OUT" | grep -q "1 quarantined" || { echo "expected 1 quarantined finding"; exit 1; }
          rm -rf .kintsugi-ci
