name: Kintsugi auto-fix

# Apply Kintsugi's verified repairs as a new PR. Triggered by commenting
# "/kintsugi-fix" on any pull request, or manually via workflow_dispatch on a
# branch. Unlike the review bot, this one WRITES: it applies every repair the
# verify gate proves, commits each one separately on a branch, and opens (or
# updates) a fix PR for you to review.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.comment.body == '/kintsugi-fix')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.ref }}

      - name: Remember the starting commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "kintsugi[bot]"
          git config user.email "kintsugi[bot]@users.noreply.github.com"

      - name: Apply and verify the repairs
        uses: Swastikbhat-lab/kintsugi@v0.3.0
        with:
          source: .
          dry: 'false'
          git: 'true'
          branch: kintsugi/fixes
          json: kintsugi-report.json
          markdown: kintsugi-report.md

      - name: Push the fix branch
        id: push
        run: |
          COUNT=$(git rev-list --count "${{ steps.base.outputs.sha }}"..kintsugi/fixes)
          echo "commits=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            git push origin kintsugi/fixes
          else
            echo "no verified fixes — nothing to propose"
          fi

      - name: Open or update the fix PR
        if: steps.push.outputs.commits != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'kintsugi/fixes';
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: existing.data[0].number,
                body: '🔄 Kintsugi has pushed new verified fixes to this PR.',
              });
              console.log(`updated existing fix PR #${existing.data[0].number}`);
              return;
            }
            let base;
            if (github.event_name === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner, repo, pull_number: context.issue.number,
              });
              base = pr.data.base.ref;
            } else {
              base = context.ref.replace('refs/heads/', '');
            }
            const created = await github.rest.pulls.create({
              owner, repo,
              title: 'Kintsugi: verified fixes',
              head: branch,
              base,
              body: [
                'This PR was produced by [Kintsugi](https://github.com/Swastikbhat-lab/kintsugi).',
                '',
                'Every commit is one repair, verified by re-running the checks after the change:',
                'the finding cleared **and** nothing new appeared. Anything Kintsugi could not',
                'prove, it left alone.',
                '',
                'Review the diff, then merge or close it — each commit stands on its own.',
              ].join('\n'),
            });
            console.log(`created fix PR #${created.data.number}`);
